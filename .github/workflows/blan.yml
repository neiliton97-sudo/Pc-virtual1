name: PC Virtual Windows Avançado

on:
  workflow_dispatch: # Iniciar manualmente na aba Actions

jobs:
  run-virtual-pc:
    runs-on: windows-latest

    steps:
      - name: 1. Preparar Ambiente e Otimizar
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        shell: powershell

      - name: 2. Instalar Programas Utilitários
        run: |
          winget install --id Google.Chrome -e --accept-source-agreements --accept-package-agreements
          winget install --id 7zip.7zip -e --accept-source-agreements --accept-package-agreements
          winget install --id Git.Git -e --accept-source-agreements --accept-package-agreements
        shell: powershell

      - name: 3. Instalar e Autenticar Tailscale
        run: |
          winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --unattended --accept-routes
        shell: powershell

      - name: 4. Criar Usuário de Acesso RDP
        run: |
          net user RunnerAdmin PCVirtual123! /add
          net localgroup administrators RunnerAdmin /add
          Write-Host "---------------------------------------------------"
          Write-Host "USUARIO RDP: RunnerAdmin"
          Write-Host "SENHA RDP:   PCVirtual123!"
          Write-Host "---------------------------------------------------"
        shell: powershell

      - name: 5. Manter PC Virtual Online (6 Horas Ativo)
        run: |
          $timeout = 21600 # 6 Horas em Segundos
          $interval = 30
          $elapsed = 0
          Write-Host "PC Virtual Ativo no Tailscale! Conecte-se pelo IP do seu painel Tailscale."
          while ($elapsed -lt $timeout) {
              Start-Sleep -Seconds $interval
              $elapsed += $interval
              Write-Host "Tempo de Execucao: $elapsed / $timeout segundos..."
          }
        shell: powershell
